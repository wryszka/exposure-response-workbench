resources:
  apps:
    exposure_response_app:
      name: exposure-response-workbench
      description: "Bricksurance SE — Exposure & Event Response Workbench (thin presentation layer over governed UC exposure functions)."
      source_code_path: ../app
      resources:
        - name: sql_warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: reset_job
          job:
            id: ${resources.jobs.exposure_99_reset.id}
            permission: CAN_MANAGE_RUN
        - name: alerts_job
          job:
            id: ${resources.jobs.exposure_30_alerts.id}
            permission: CAN_MANAGE_RUN
